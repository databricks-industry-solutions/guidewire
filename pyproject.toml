
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "guidewire-cda-delta-clone"
version = "0.2.1"
dependencies = [
    "pyarrow==23.0.1",
    "ray[default]==2.45.0",
    "deltalake==1.2.1",
    "rich==14.1.0",
    'importlib-metadata; python_version>"3.10"',
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "boto3==1.40.23",
    "requests==2.32.3",
    "azure-storage-blob==12.26.0",
    "faker==23.7.0",
]


[tool.setuptools.packages.find]
where = ["."]  # Look for packages in the root directory